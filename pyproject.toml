[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CompactObject_TOV"
version = "2.1.1"
authors = [
  { name="Chun Huang", email="author@example.com" },
]
description = "Bayesian inference framework for neutron-star equations of state"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
]
dependencies = [
  "corner",
  "h5py",
  "lxml",
  "matplotlib",
  "numpy",
  "pandas",
  "numba",
  "requests",
  "scipy",
  "sympy",
  "ultranest",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel",
  "jupyter",
  "nbconvert",
]
fast = [
  "NumbaMinpack",
]
docs = [
  "decorator",
  "ipynb",
  "nbsphinx",
  "sphinx",
  "sphinx-rtd-theme",
  "sphinxcontrib-websupport",
]
test = [
  "pytest",
]

[project.urls]
Homepage = "https://github.com/ChunHuangPhy/CompactObject"
Issues = "https://github.com/ChunHuangPhy/CompactObject/issues"

[tool.setuptools.packages.find]
include = [
  "EOSgenerators*",
  "InferenceWorkflow*",
  "postprocessing*",
  "TOVsolver*",
]
exclude = [
  "docs*",
  "Emcee_Workflow*",
  "JOSS*",
  "Test_Case*",
]

[tool.setuptools.package-data]
EOSgenerators = [
  "filesCompose/*",
  "filesLaL/*",
]
InferenceWorkflow = [
  "data/*",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
filterwarnings = [
  "error::RuntimeWarning",
]
